## Windowrule configuration ##

# Syntax: windowrule = rule>, <criteria>

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus 1, match:class ^$#,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Make only Nautilus have transparency
windowrule = opacity 0.9, match:class org.gnome.Nautilus

# Don’t let apps auto-fullscreen
windowrule = suppress_event fullscreen, match:class .*
